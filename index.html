<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script
            src="http://code.jquery.com/jquery-3.3.1.min.js"
            integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
            crossorigin="anonymous"></script>
    <link rel="stylesheet"
          href="/static/bootstrap/bootstrap.min.css">
    <script src="/static/bootstrap/bootstrap.min.js"></script>
    <script src="/static/cropper/cropper.min.js"></script>
    <link rel="stylesheet"
          href="/static/cropper/cropper.min.css">
    <title>蛇年新春专属头像框制作</title>
    <style>
        /* body {

        } */

        .inner-pic {
            padding: 10px;
        }

        .container-fluid {
            max-width: 750px;
        }

        .avatar-preview-border {
            /*border: #000000 5px dotted;*/
            overflow: hidden;
            zoom: 0.5;
            width: fit-content;
            height: fit-content;
            padding: 0;
            margin: 0;
        }

        .avatar-release-border {
            /* border: #CC3300 2px solid;*/
            overflow: hidden;
            zoom: 0.3;
            width: fit-content;
            height: fit-content;
            padding: 0;
        }

        #release {
            max-width: 800px;
            max-height: 800px;
        }

        .avatar-preview {
        }

        .cbtn {
            background: #ffffff;
            padding: 0;
            margin: 0;
            /*border-radius: 10px;*/
        }

        .row {
            margin-top: 1%;
            margin-bottom: 1%;
            padding: 0;
            margin-left: 0;
            margin-right: 0;
        }

        .header {
            -moz-box-shadow: 0 0 20px #333333;
            -webkit-box-shadow: 0 0 20px #333333;
            box-shadow: 0 0 20px #333333;
            width: 100%;
        }

        .footer {
            /*-moz-box-shadow: 0 0 20px #333333;*/
            /*-webkit-box-shadow: 0 0 20px #333333;*/
            /*box-shadow: 0 0 20px #333333;*/
            width: 100%;
            height: 100%;
            background: linear-gradient(300deg, #990000, #CC3300);
        }

        .container-fluid {
            padding: 0;
            background-image: url("/static/image/背景图.png"), linear-gradient(330deg, #FFE9F1, #E7F5FF);
            background-repeat: no-repeat;
            background-size: cover;
        }

        .block {
            margin: 0;
            padding: 0;
        }


        p {
            color: #ffffff;
        }

        .edit-border {
            width: fit-content;
            height: fit-content;
            padding: 5px;
            border: #CC3300;
            border-style: solid;
            /*border-radius: 10px;*/
        }

        .edit-box {
            width: 300px;
            height: 300px;
        }

        .c {
            float: none;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .title_background {
            background-image: url("/static/image/抬头框.png");
            background-repeat: no-repeat;
            background-size: 80% 100%;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .row_space {
            width: 50%;
            padding: 0;
        }

        .image_row {
            margin-top: 2%;
            margin-bottom: 2%;
            display: flex;
            justify-content: space-around;
        }

        .text-center {
            text-align: center;
            color: gray;
        }

    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row block title_background">
        <div class="col-xs-12 center-block block" style="width: 60%;margin-top: 20px;margin-bottom: 20px">
            <img src="/static/image/logo1.png" style="width: 100%">
        </div>
    </div>
    <div class="row" style="margin-top: 30px;margin-bottom: 30px;display: flex;justify-content: center">
        <div class="col-xs-12" style="width: 70%">
            <img class="img-responsive center-block" style="width: 100%"
                 src="/static/image/小标题.png">
        </div>
    </div>
    <div class="row" style="width: 85%; background-color: white; border-radius: 25px; margin: auto;">
        <div class="col-xs-12" style="padding: 5px">
            <div class="row image_row">
                <div class="col-xs-4 inner-pic row_space">
                    <img class=" img-responsive center-block cbtn"
                         src="/static/image/edge/shijia-avatar1.png"
                         onclick="chooseBorder('/static/image/edge/shijia-avatar1.png')"
                         style="width: 90%; margin: auto;">
                </div>
                <div class="col-xs-4 inner-pic row_space">
                    <img class=" img-responsive center-block cbtn"
                         src="/static/image/edge/shijia-avatar2.png"
                         onclick="chooseBorder('/static/image/edge/shijia-avatar2.png')"
                         style="width: 90%; margin: auto;">
                </div>
            </div>
            <div class="row image_row">
                <div class="col-xs-4 inner-pic row_space">
                    <img class=" img-responsive center-block cbtn"
                         src="/static/image/edge/shijia-avatar3.png"
                         onclick="chooseBorder('/static/image/edge/shijia-avatar3.png')"
                         style="width: 90%; margin: auto;">
                </div>
                <div class="col-xs-4 inner-pic row_space">
                    <img class=" img-responsive center-block cbtn"
                         src="/static/image/edge/shijia-avatar4.png"
                         onclick="chooseBorder('/static/image/edge/shijia-avatar4.png')"
                         style="width: 90%; margin: auto;">
                </div>
            </div>
        </div>
    </div>

    <div class="row edit" id="edit-row" style="margin-bottom: 2%;margin-top: 2%">
        <div class="col-xs-6">

            <div class="row" style="margin-bottom: 2%">
                <div class="col-xs-12">
                    <label for="file" class="btn btn-danger center-block"
                           style="width: 100px;margin-top: 15px">选择图片</label>
                    <input type="file" id="file" accept="image/*" onchange="onFileChange()" style="display: none">
                </div>

            </div>

            <div class="row" style="margin-bottom: 2%">
                <div class="col-xs-12">
                    <button class="btn btn-danger center-block" onclick="release()" style="width: 100px">生成头像
                    </button>
                </div>
            </div>

        </div>
        <div class="col-xs-6">
            <div class="avatar-preview-border">
                <div class="avatar-preview"></div>
            </div>
        </div>
    </div>

    <div class="row edit-avatar">
        <div class="col-xs-12">
            <div class="edit-border c">
                <div class="edit-box">
                    <canvas id="avatar" style="display: block"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="row c edit-avatar" style="width: 60%;">
        <div class="col-xs-6">
            <button class="btn btn-danger center-block" onclick="rotate(-90)" style="width: 100px">向左旋转</button>
        </div>
        <div class="col-xs-6">
            <button class="btn btn-danger center-block" onclick="rotate(90)" style="width: 100px">向右旋转</button>
        </div>
    </div>
    <!-- <div class="row" style="margin-top: 60px;margin-bottom: 20px;display: flex;justify-content: center">
        <div class="col-xs-12" style="width: 60%">
            <img class="img-responsive center-block" style="width: 100%"
                 src="/static/image/士嘉书院学生宣传媒体中心.png">
        </div>
    </div> -->
    <div class="row block">
        <div class="col-xs-12 center-block block text-center">
            <img class="footer" src="/static/image/宣媒.png">
        </div>
    </div>

    <div class="modal fade" id="release-modal" role="dialog" aria-labelledby="release-modal-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">×</button>
                    <h4 class="modal-title" id="release-modal-label">蛇年新春专属头像框制作</h4></div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="avatar-release-border c">
                                <div id="release"></div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-xs-12">
                            <h5 class="text-center">注：PC端用户请右击图片选择保存，移动端用户请长按图片后选择保存。</h5>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-dismiss="modal">返回</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>

    var img = new Image();
    var $avatar = $('#avatar');
    var flag = true;
    var maxLength = 2800;

    $(document).ready(
        function () {
            img = new Image();
            $avatar.cropper({
                aspectRatio: 1 / 1,
                viewMode: 0,
                movable: true,
                scalable: true,
                rotatable: true,
                toggleDragModeOnDblclick: false,
                minCropBoxHeight: 50,
                minCropBoxWidth: 50,
                zoomOnTouch: true,
                crop: function (event) {
                    updatePreview();
                },
                ready: function () {
                    if (flag) {
                        $('.edit').hide();
                        $('.edit-avatar').hide();
                        flag = false;
                    }
                }
            });

            // // 获取第三个 div 内部的宽度和高度
            // const image20 = document.getElementById("image20");
            // const image20Width = image20.clientWidth;
            //
            // /*const image18 = document.getElementById("image18");
            // const image18Width = image18.clientWidth;*/
            //
            // /*const w16 = (image18Width - (image18Width - 20) * 0.8894) / 2;
            // const w17 = (image18Width - (image18Width - 20) * 0.9291) / 2;*/
            // const w19 = (image20Width - (image20Width - 20) * 0.905) / 2;
            // const w21 = (image20Width - (image20Width - 20) * 0.905) / 2;
            //
            // // 设置其他两个 div 的 padding 宽度
            // /*const image16 = document.getElementById("image16");
            // const image17 = document.getElementById("image17");*/
            // const image19 = document.getElementById("image19");
            // const image21 = document.getElementById("image21");
            //
            // /*image16.style.padding = w16 + "px";
            // image17.style.padding = w17 + "px";*/
            // image19.style.padding = w19 + "px";
            // image21.style.padding = w21 + "px";
        }
    );

    function updatePreview() {
        var $avatar = $('#avatar');
        var cropper = $avatar.data('cropper');
        var cas = cropper.getCroppedCanvas({
            width: 300,
            height: 300,
            fillColor: "#ffffff"
        });
        var ctx = cas.getContext('2d');
        ctx.drawImage(img, 0, 0, 300, 300);
        $('.avatar-preview').html(cas);
    }

    function chooseBorder(url) {
        img = new Image();
        img.src = url;
        img.onload = function () {
            $('.edit').show();
            updatePreview();
            $(window).scrollTop($('#edit-row').offset().top);
        };
        img.src = url;
        onFileChange()
    }

    function rotate(angle) {
        $avatar.cropper("rotate", angle);
        console.log(angle);
    }

    function onFileChange() {
        $('.edit-avatar').show();
        var file0 = $("#file")[0].files[0];
        if (!file0) return;
        var url0 = URL.createObjectURL(file0);
        var $avatar = $('#avatar');
        var $avatar_preview = $(".avatar-preview");
        var cropper = $avatar.data('cropper');


        var m = new Image();

        m.src = url0;
        m.onload = function () {
            if (m.width > maxLength) {
                m.height = m.height / m.width * maxLength;
                m.width = maxLength;
            }
            if (m.height > maxLength) {
                m.width = m.width / m.height * maxLength;
                m.height = maxLength;
            }
            var cc = document.createElement("canvas");
            cc.width = m.width;
            cc.height = m.height;
            var cx = cc.getContext('2d');
            cx.drawImage(m, 0, 0, m.width, m.height);
            var url;
            url = cc.toDataURL("image/png");
            cropper.replace(url);
        };
    }

    function release() {
        var $avatar = $('#avatar');
        var cropper = $avatar.data('cropper');
        var $release = $('#release');
        var cas = cropper.getCroppedCanvas({
            width: maxLength,
            height: maxLength,
            fillColor: "#ffffff"
        });
        var ctx = cas.getContext('2d');
        ctx.drawImage(img, 0, 0, maxLength, maxLength);
        var avaimg = new Image();
        avaimg.src = cas.toDataURL("image/jpeg");
        avaimg.width = 800;
        avaimg.height = 800;
        $release.html(avaimg);
        $('#release-modal').modal();
    }

</script>

</body>
</html>
